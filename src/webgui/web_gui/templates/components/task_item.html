<div class="task-item bg-white rounded-xl shadow-sm hover:shadow-md transition-shadow overflow-hidden border border-gray-200" data-task-name="{{ task.name }}">
    <div class="task-header bg-gray-50 p-4 flex justify-between items-center cursor-pointer hover:bg-gray-100 transition-colors" onclick="toggleTask(this)">
        <div class="flex items-center space-x-3">
            <span class="w-2 h-8 bg-indigo-500 rounded-full"></span>
            <div>
                <span class="task-name font-bold text-gray-700 text-lg block">{{ task.config.title if task.config and task.config.title else task.name }}</span>
                {% if task.config and task.config.description %}
                <span class="text-xs text-gray-500 font-normal">{{ task.config.description }}</span>
                {% endif %}
            </div>
        </div>
        <i class="fas fa-chevron-down toggle-arrow text-gray-400 transition-transform duration-300"></i>
    </div>
    
    <div class="task-content hidden p-6 border-t border-gray-100 bg-white">
        <!-- FORM CONTENT -->
        {% include 'components/task_form.html' %}

        <!-- ACTIONS -->
        <div class="mt-6 flex space-x-3">
            <button id="btn-run-{{ task.name|replace('.', '_') }}" onclick="runTask('{{ task.name }}')" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2.5 px-4 rounded-lg transition duration-200 flex justify-center items-center shadow-sm">
                <i class="fas fa-play mr-2"></i> Run Task
            </button>
            <button id="btn-stop-{{ task.name|replace('.', '_') }}" onclick="stopTask('{{ task.name }}')" class="hidden flex-1 bg-red-500 hover:bg-red-600 text-white font-bold py-2.5 px-4 rounded-lg transition duration-200 flex justify-center items-center shadow-sm">
                <i class="fas fa-stop mr-2"></i> Stop
            </button>
            <div class="flex space-x-2">
                <button onclick="openConfigModal('{{ task.name }}', 'save')" class="bg-white border border-gray-300 hover:bg-gray-50 text-gray-600 font-bold py-2.5 px-4 rounded-lg transition duration-200 shadow-sm" title="Save Configuration">
                    <i class="fas fa-save"></i>
                </button>
                <button onclick="openConfigModal('{{ task.name }}', 'load')" class="bg-white border border-gray-300 hover:bg-gray-50 text-gray-600 font-bold py-2.5 px-4 rounded-lg transition duration-200 shadow-sm" title="Load Configuration">
                    <i class="fas fa-folder-open"></i>
                </button>
                <button onclick="resetForm('{{ task.name }}')" class="bg-white border border-gray-300 hover:bg-gray-50 text-gray-600 font-bold py-2.5 px-4 rounded-lg transition duration-200 shadow-sm" title="Reset to Defaults">
                    <i class="fas fa-undo"></i>
                </button>
            </div>
        </div>
    </div>
</div>
