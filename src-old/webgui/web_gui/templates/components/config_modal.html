<!-- CONFIGURATION MODAL -->
<div id="config-modal" class="fixed inset-0 bg-black/50 z-50 hidden items-center justify-center p-4 backdrop-blur-sm transition-opacity duration-300">
    <div class="bg-white rounded-xl shadow-2xl w-full max-w-md overflow-hidden transform transition-all scale-100">
        <!-- Header -->
        <div class="bg-gray-50 px-6 py-4 border-b border-gray-200 flex justify-between items-center">
            <h3 id="config-modal-title" class="font-bold text-gray-700 text-lg">Manage Configurations</h3>
            <button onclick="closeConfigModal()" class="text-gray-400 hover:text-gray-600 focus:outline-none text-2xl">&times;</button>
        </div>

        <!-- Body -->
        <div class="p-6">
            <!-- SAVE MODE -->
            <div id="config-save-mode" class="hidden space-y-4">
                <p class="text-sm text-gray-600">Enter a name to save the current configuration for this task.</p>
                <div>
                    <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Config Name</label>
                    <input type="text" id="config-name-input" class="w-full border-gray-300 rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500 p-2 border" placeholder="e.g., experimental_run_1">
                </div>
                <div class="flex justify-end pt-2">
                    <button onclick="confirmSaveConfig()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-4 rounded shadow-sm transition">
                        <i class="fas fa-save mr-2"></i> Save
                    </button>
                </div>
            </div>

            <!-- LOAD MODE -->
            <div id="config-load-mode" class="hidden space-y-4">
                <p class="text-sm text-gray-600">Select a saved configuration to load.</p>
                <div id="config-list" class="max-h-48 overflow-y-auto space-y-2 border border-gray-100 rounded-md p-2 bg-gray-50">
                    <div class="text-center text-gray-400 text-sm py-4">Loading configs...</div>
                </div>
            </div>
        </div>
    </div>
</div>
